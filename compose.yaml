services:
  server:
    build: .
    container_name: 3arabeyety_app
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: 3arabeyety_laravel_nginx
    ports:
      - "4000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server

  mysql:
    image: mysql:8.0
    container_name: 3arabeyety_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: 3arabeyety
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: